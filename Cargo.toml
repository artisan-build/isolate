[package]
name = "isolate"
version = "0.1.0"
edition = "2021"
publish = false
# Cloud reads default-run when the environment is created and never looks again.
default-run = "isolate"

[dependencies]
axum = "0.8.9"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
# Test-only. sha2 pins the shared page, tower drives the router without a socket,
# and tokio's io-util reads a raw response off one.
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["io-util"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
strip = true
