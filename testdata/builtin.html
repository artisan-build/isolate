<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Temporarily unavailable</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #f6f6f5;
  color: #1c1b19;
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main {
  width: 100%;
  max-width: 34rem;
  background: #ffffff;
  border: 1px solid #e3e1dd;
  border-radius: 12px;
  padding: 32px;
}
h1 {
  margin: 0 0 12px;
  font-size: 1.375rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: #1c1b19;
}
.logo { display: block; max-width: 100%; max-height: 72px; margin: 0 0 20px; }
p { margin: 0; }
p + p { margin-top: 12px; }
.muted { color: #6b665f; font-size: 0.875rem; }
</style>
</head>
<body>
<main data-testid="isolate-page">
<header data-testid="isolate-brand">

<h1>Temporarily unavailable</h1>
</header>
<section data-testid="isolate-message">
<p>This site is temporarily unavailable. It will be back shortly.</p>
</section>
<footer data-testid="isolate-footer">
<p class="muted">Please try again later.</p>
</footer>
</main>
</body>
</html>
